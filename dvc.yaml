stages :
  data_ingestion:
    cmd : python src/cnnClassifier/pipeline/stage_01_ingestion.py
    deps:
      - src/cnnClassifier/pipeline/stage_01_ingestion.py
      - config/config.yaml
    outs:
      - artifacts/data_ingestion/Chicken-fecal-images
  

  prepare_base_model:
    cmd: python src/cnnClassifier/pipeline/stage_02_prepare_base_model.py
    deps:
      - src/cnnClassifier/pipeline/stage_02_prepare_base_model.py
      - config/config.yaml
    params : 
      - IMAGE_SIZE
      - INCLUDE_TOP
      - CLASSES 
      - WEIGHTS
      - LEARNING_RATE
    outs:
      - artifacts/prepare_base_model
  training:
    cmd : python src/cnnClassifier/pipeline/stage_04_training.py
    deps:
      - src/cnnClassifier/pipeline/stage_04_training.py
      - src/cnnClassifier/components/prepare_callbacks.py
      - config/config.yaml
      - artifacts/data_ingestion/Chicken-fecal-images
      - artifacts/prepare_base_model
    params:
      - EPOCHS
      - BATCH_SIZE
      - AUMENTATION
    outs:
      - artifacts/training/model.h5
  
  evaluation:
    cmd: python src/cnnClassifier/components/evaluation.py
    deps:
      - src/cnnClassifier/components/evaluation.py
      - config/config.yaml
      - artifacts/data_ingestion/Chicken-fecal-images
      - artifacts/training/model.h5
    params:
      - IMAGE_SIZE
      - BATCH_SIZE
   
    metrics:
    - scores.json:
        cache: false

    